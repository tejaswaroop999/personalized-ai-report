name: Browser smoke checks and demo evidence
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Install isolated browser capture tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Start production app
        run: npm start > /tmp/insightforge-demo.log 2>&1 &
      - name: Capture real UI and verify the fallback flow
        run: node scripts/capture-demo.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insightforge-demo-evidence
          path: demo-evidence/
          if-no-files-found: warn
